<section class="login">
  <div class="login__container">
    <div class="login__header">
      <h1>Iniciar sesión</h1>
      <p>Acceso administrativo</p>
    </div>

    <form class="login__form" (ngSubmit)="login()">
      <mat-form-field appearance="outline">
        <mat-label>Usuario</mat-label>
        <input
          matInput
          type="text"
          name="usuario"
          [(ngModel)]="usuario"
          autocomplete="username"
          [disabled]="loading">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          [disabled]="loading">
      </mat-form-field>

      @if (errorMessage) {
        <div class="login__error">
          {{ errorMessage }}
        </div>
      }

      <button
        mat-flat-button
        type="submit"
        [disabled]="loading">
        {{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>

      <button
        mat-button
        type="button"
        [disabled]="loading"
        (click)="volverAlPos()">
        Volver al POS
      </button>
    </form>
  </div>
</section>
