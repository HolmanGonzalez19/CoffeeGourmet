<div class="open-cash-register-dialog">
  <div class="dialog-header">
    <div class="dialog-icon">
      <div mat-card-avatar class="card__icon">
        <mat-icon>point_of_sale</mat-icon>
      </div>
    </div>
    <h2>Abrir caja</h2>
  </div>

  <p class="dialog-description">
    Ingrese el efectivo inicial disponible en la caja.
  </p>

  <div class="dialog-input-group">
    <label for="monto">MONTO INICIAL (COP)</label>

    <mat-form-field appearance="outline" class="dialog-input">
      <span matTextPrefix>$&nbsp;</span>
      <input
        matInput
        id="monto"
        type="number"
        min="0"
        step="100"
        [(ngModel)]="montoInicial"
        placeholder="0"
      />
      <span matTextSuffix>NUM</span>
    </mat-form-field>

    <div class="dialog-suggestion">
      <span>Valor sugerido basado en el último cierre:</span>
      <strong>$100.000</strong> <!-- HOLMAN CORREGUIR -->
    </div>
  </div>

  <div class="dialog-options">
    <button mat-stroked-button type="button" (click)="montoInicial = 50000">
      $50.000
    </button>
    <button mat-stroked-button type="button" (click)="montoInicial = 100000">
      $100.000
    </button>
    <button mat-stroked-button type="button" (click)="montoInicial = 200000">
      $200.000
    </button>
  </div>

  @if (errorMessage) {
    <div class="dialog-error">
      {{ errorMessage }}
    </div>
  }

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button type="button" class="product-dialog__button product-dialog__button--secondary" (click)="cancelar()">
      Cancelar
    </button>

    <button
      mat-flat-button
      type="button"
      class="button-red-light button-red-light--primary"
      [disabled]="!montoInicial || montoInicial <= 0"
      (click)="confirmar()"
    >
      Abrir caja →
    </button>
  </mat-dialog-actions>
</div>
